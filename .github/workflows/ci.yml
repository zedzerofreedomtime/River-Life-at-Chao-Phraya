name: Verify monorepo
on: [push, pull_request]
jobs:
  web:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: "24", cache: npm }
      - run: npm ci
      - run: npm run format:check
      - run: npm run build
  e2e:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      POSTGRES_PASSWORD: ci-only-database-password
      ADMIN_PASSWORD: ci-only-admin-password
      OTP_DELIVERY_MODE: demo
      BOOKING_EMAIL_MODE: disabled
      TEST_BASE_URL: http://localhost:3000
      E2E_ALLOW_WRITES: "1"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: "24", cache: npm }
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      - run: docker compose -p riverlife-ci up -d --build --wait --wait-timeout 120
      - name: Wait for application
        run: |
          for attempt in $(seq 1 30); do
            if curl --fail http://localhost:3000/api/v1/event; then exit 0; fi
            sleep 2
          done
          exit 1
      - run: npx playwright test --workers=2 --reporter=list,html
      - name: Service diagnostics
        if: failure()
        run: docker compose -p riverlife-ci logs --tail=100
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: playwright-results
          path: |
            playwright-report/
            test-results/
          retention-days: 14
      - name: Remove disposable test stack
        if: always()
        run: docker compose -p riverlife-ci down -v
  api:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17-alpine
        env: { POSTGRES_PASSWORD: test, POSTGRES_DB: riverlife }
        ports: ["5432:5432"]
        options: --health-cmd "pg_isready -U postgres" --health-interval 5s --health-retries 10
      redis:
        image: redis:7-alpine
        ports: ["6379:6379"]
    env:
      TEST_DATABASE_URL: postgres://postgres:test@localhost:5432/riverlife?sslmode=disable
      TEST_REDIS_URL: redis://localhost:6379/0
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with: { go-version: "1.25", cache-dependency-path: apps/api/go.sum }
      # Packages share one test database and bootstrap its schema on Open.
      # Serialize packages, not the concurrency scenarios inside each test.
      - run: go test -race -count=1 -p 1 ./...
        working-directory: apps/api
      - run: go vet ./...
        working-directory: apps/api
